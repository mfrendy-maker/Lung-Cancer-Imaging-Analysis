services:
  - type: web
    name: lung-ct-gui
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LUNG_GUI_HOST
        value: 0.0.0.0
      - key: LUNG_GUI_DEMO
        value: "1"
      - key: LUNG_GUI_TRUST_PROXY
        value: "1"
      - key: LUNG_GUI_MAX_MB
        value: "10"
      - key: LUNG_GUI_TOKEN
        generateValue: true
