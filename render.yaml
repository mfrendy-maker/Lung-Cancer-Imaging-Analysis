services:
  - type: web
    name: lung-ct-gui
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LUNG_GUI_HOST
        value: 0.0.0.0
      - key: LUNG_GUI_DEMO
        value: "1"
      - key: LUNG_GUI_TRUST_PROXY
        value: "1"
      - key: LUNG_GUI_MAX_MB
        value: "10"
      - key: LUNG_GUI_TOKEN
        generateValue: true

name: Sync to Hugging Face Hub
on:
  push:
    branches: [main] # Update to 'master' if that is your default branch
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://frendy12:$HF_TOKEN@huggingface.co/spaces/frendy12/lung-cancer-CT-analysis main
